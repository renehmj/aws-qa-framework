[pytest]
testpaths = tests/smoke tests/regression tests/guardrails tests/load tests/selftest
addopts = -v -ra --strict-markers --junitxml=reports/junit.xml
markers =
    smoke: is it alive, run first
    regression: did a change break anything
    guardrail: SCP and permission tests (need a real AWS account)
    load: k6 load test
    selftest: proves the checks catch bad things (mock only)
    aws: AWS account module
    code: application code module
    api: API module
    connectivity: network ports module
    database: database module
    os: server and RHEL image module (Ansible and OpenSCAP)
    serverless: AWS Lambda module
    cmdb: CMDB module
