---
# Reach servers through AWS Systems Manager. No SSH keys, and port 22 stays closed.
ansible_connection: amazon.aws.aws_ssm
ansible_aws_ssm_region: "{{ lookup('ansible.builtin.env', 'AWS_REGION', default='us-east-1') }}"
ansible_aws_ssm_bucket_name: "{{ lookup('ansible.builtin.env', 'QA_SSM_BUCKET') }}"

# Every server and RHEL image must have these packages.
required_packages:
  - openscap-scanner
  - scap-security-guide
  - chrony
  - audit
  - bzip2

# OpenSCAP content for RHEL 9.
scan_datastream: /usr/share/xml/scap/ssg/content/ssg-rhel9-ds.xml
scan_profile: xccdf_org.ssgproject.content_profile_cis_server_l1
vulnerability_feed: https://security.access.redhat.com/data/oval/v2/RHEL9/rhel-9.oval.xml.bz2
