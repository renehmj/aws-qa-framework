# Settings shared by every environment.
# Each environment file can replace any of these.

# Defaults for a laptop run. In the pipeline, the GitHub variables
# AWS_REGION and QA_BLOCKED_REGION replace these. See docs/OIDC_SETUP.md.
region: us-east-1
blocked_region: us-west-2

# Every EC2 instance must have these tags (FinOps).
required_tags:
  - CostCenter
  - Owner
  - Environment

# What SCPs must allow or deny. Nothing is really run, AWS only answers yes or no.
scp_rules:
  - action: cloudtrail:StopLogging
    expect: deny
  - action: cloudtrail:DeleteTrail
    expect: deny
  - action: organizations:LeaveOrganization
    expect: deny
  - action: ec2:DescribeInstances
    expect: allow

  # Tag enforcement: starting an instance with no CostCenter tag is denied.
  - action: ec2:RunInstances
    expect: deny
  - action: ec2:RunInstances
    expect: allow
    context:
      aws:RequestTag/CostCenter: "1234"

# Ports that must not be reachable on a server.
closed_ports: [22, 3389, 5432]

# Hybrid: paths that must work, such as cloud to on-prem over VPN.
# List them in the QA_REQUIRED_CONNECTIONS variable, so addresses stay out of this repo.
required_connections: []

# Lambda runtimes that are out of support.
blocked_lambda_runtimes: [python3.8, python3.9, nodejs16.x, nodejs18.x]

# What the database tests check on every database.
database_tables:
  - name: battery_units
    min_rows: 1
    not_null: [unit_id, site, capacity_mwh]
    key: [unit_id]
  - name: schema_migrations
    min_rows: 1
    not_null: [version]
    key: [version]

# What a server or RHEL image must look like. Ansible collects these values.
os_expected:
  distribution: RedHat
  major_version: "9"
  selinux: enforcing
  ssh_root_login: "no"
  ssh_password_login: "no"
  telemetry_service: running
  missing_packages: []

# Which OpenSCAP results fail a test.
scan:
  fail_on_severity: [high]
  fail_on_vulnerability: [Critical, Important]

  # Accepted risks. Every waiver needs a reason a reviewer can challenge.
  waived_rules:
    grub2_password: Cloud server with no console access, so nobody reaches the boot menu.
    no_empty_passwords: Login is through Systems Manager only, with no local passwords.
