[pytest]
testpaths = tests
pythonpath = . ..
addopts = -v -ra --strict-markers --import-mode=importlib --junitxml=reports/junit.xml
markers =
    smoke: is it alive, run first
    regression: did a change break anything
    guardrail: SCP and permission tests (need a real AWS account)
    load: k6 load test
    selftest: proves the checks catch bad things (mock only)
